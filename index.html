<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo List</title>
    <style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
    font-family: Arial, sans-serif;
    background: #f0f2f5;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    padding: 40px 16px;
}
.container {
    background: #fff;
    border-radius: 12px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.1);
    padding: 32px;
    width: 100%;
    max-width: 500px;
    height: fit-content;
}
h1 { text-align: center; color: #3a86ff; font-size: 2rem; margin-bottom: 24px; }
.input-area { display: flex; gap: 8px; margin-bottom: 16px; }
.input-area input {
    flex: 1; padding: 10px 14px; border: 2px solid #ddd;
    border-radius: 8px; font-size: 1rem; outline: none; transition: border-color 0.2s;
}
.input-area input:focus { border-color: #3a86ff; }
.input-area button {
    padding: 10px 20px; background: #3a86ff; color: #fff;
    border: none; border-radius: 8px; font-size: 1rem;
    cursor: pointer; transition: background 0.2s;
}
.input-area button:hover { background: #2563eb; }
.filters { display: flex; gap: 8px; margin-bottom: 16px; }
.filter-btn {
    flex: 1; padding: 8px; border: 2px solid #ddd; background: #fff;
    border-radius: 8px; font-size: 0.9rem; cursor: pointer; transition: all 0.2s;
}
.filter-btn.active { border-color: #3a86ff; color: #3a86ff; font-weight: bold; }
#todo-list { list-style: none; min-height: 40px; }
#todo-list li {
    display: flex; align-items: center; gap: 12px;
    padding: 12px 8px; border-bottom: 1px solid #f0f0f0; transition: background 0.1s;
}
#todo-list li:last-child { border-bottom: none; }
#todo-list li:hover { background: #f8faff; border-radius: 8px; }
#todo-list li input[type="checkbox"] { width: 18px; height: 18px; cursor: pointer; accent-color: #3a86ff; }
#todo-list li .todo-text { flex: 1; font-size: 1rem; color: #333; word-break: break-word; }
#todo-list li.completed .todo-text { text-decoration: line-through; color: #aaa; }
#todo-list li .delete-btn {
    background: none; border: none; color: #ccc;
    font-size: 1.2rem; cursor: pointer; line-height: 1;
    padding: 0 4px; transition: color 0.2s;
}
#todo-list li .delete-btn:hover { color: #ef4444; }
.footer {
    display: flex; justify-content: space-between; align-items: center;
    margin-top: 16px; padding-top: 12px; border-top: 1px solid #f0f0f0;
    font-size: 0.9rem; color: #888;
}
#clear-completed {
    background: none; border: none; color: #888;
    cursor: pointer; font-size: 0.9rem; transition: color 0.2s;
}
#clear-completed:hover { color: #ef4444; }
.empty-msg { text-align: center; color: #ccc; padding: 24px 0; font-size: 0.95rem; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Todo List</h1>
        <div class="input-area">
            <input type="text" id="todo-input" placeholder="Add a new task..." maxlength="200" />
            <button id="add-btn">Add</button>
        </div>
        <div class="filters">
            <button class="filter-btn active" data-filter="all">All</button>
            <button class="filter-btn" data-filter="active">Active</button>
            <button class="filter-btn" data-filter="completed">Completed</button>
        </div>
        <ul id="todo-list"></ul>
        <div class="footer">
            <span id="items-left">0 items left</span>
            <button id="clear-completed">Clear Completed</button>
        </div>
    </div>
    <script>
let todos = JSON.parse(localStorage.getItem('todos') || '[]');
let _nextId = todos.length ? Math.max(...todos.map(t => t.id)) + 1 : 1;
let filter = 'all';

const input = document.getElementById('todo-input');
const addBtn = document.getElementById('add-btn');
const list = document.getElementById('todo-list');
const itemsLeft = document.getElementById('items-left');
const clearBtn = document.getElementById('clear-completed');
const filterBtns = document.querySelectorAll('.filter-btn');

function saveTodos() { localStorage.setItem('todos', JSON.stringify(todos)); }

function render() {
    const filtered = todos.filter(t => {
        if (filter === 'active') return !t.done;
        if (filter === 'completed') return t.done;
        return true;
    });
    if (filtered.length === 0) {
        list.innerHTML = '<li class="empty-msg">No tasks here!</li>';
    } else {
        list.innerHTML = filtered.map(t => `
            <li class="${t.done ? 'completed' : ''}" data-id="${t.id}">
                <input type="checkbox" ${t.done ? 'checked' : ''} />
                <span class="todo-text">${escapeHtml(t.text)}</span>
                <button class="delete-btn" title="Delete">&#x2715;</button>
            </li>`).join('');
    }
    const count = todos.filter(t => !t.done).length;
    itemsLeft.textContent = `${count} item${count !== 1 ? 's' : ''} left`;
}

function escapeHtml(str) {
    return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function addTodo() {
    const text = input.value.trim();
    if (!text) return;
    todos.push({ id: _nextId++, text, done: false });
    input.value = '';
    saveTodos(); render();
}

addBtn.addEventListener('click', addTodo);
input.addEventListener('keydown', e => { if (e.key === 'Enter') addTodo(); });

list.addEventListener('click', e => {
    const li = e.target.closest('li[data-id]');
    if (!li) return;
    const id = Number(li.dataset.id);
    if (e.target.matches('input[type="checkbox"]')) {
        const t = todos.find(t => t.id === id);
        if (t) { t.done = !t.done; saveTodos(); render(); }
    }
    if (e.target.matches('.delete-btn')) {
        todos = todos.filter(t => t.id !== id);
        saveTodos(); render();
    }
});

clearBtn.addEventListener('click', () => {
    todos = todos.filter(t => !t.done);
    saveTodos(); render();
});

filterBtns.forEach(btn => {
    btn.addEventListener('click', () => {
        filter = btn.dataset.filter;
        filterBtns.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        render();
    });
});

render();
    </script>
</body>
</html>
